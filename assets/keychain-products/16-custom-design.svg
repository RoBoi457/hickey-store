<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="studioBg" cx="38%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#f2efe9"/>
      <stop offset="60%" stop-color="#e3dfd7"/>
      <stop offset="100%" stop-color="#d2cdc3"/>
    </radialGradient>
    <radialGradient id="discShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12141a" stop-opacity="0.34"/>
      <stop offset="68%" stop-color="#12141a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#12141a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blackAcrylic" cx="34%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#292d36"/>
      <stop offset="35%" stop-color="#14161c"/>
      <stop offset="85%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#040507"/>
    </radialGradient>
    <linearGradient id="rimSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="glossSweep" x1="15%" y1="5%" x2="70%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#cfd5de"/>
      <stop offset="55%" stop-color="#8b929e"/>
      <stop offset="78%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#767d88"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#181b22" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- Studio surface -->
  <rect width="1000" height="1000" fill="url(#studioBg)"/>

  <!-- Ambient shadow -->
  <ellipse cx="435" cy="595" rx="310" ry="270" transform="rotate(-12 435 595)" fill="url(#discShadow)"/>

  <!-- Silver split keyring -->
  <g transform="translate(725 265) rotate(32)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="118" fill="none" stroke="url(#silverMetal)" stroke-width="24"/>
    <circle cx="0" cy="0" r="112" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4"/>
    <circle cx="0" cy="0" r="126" fill="none" stroke="#5c626d" stroke-opacity="0.35" stroke-width="3"/>
  </g>

  <!-- Silver chain links -->
  <g stroke="url(#silverMetal)" fill="none" stroke-linecap="round">
    <rect x="615" y="318" width="46" height="24" rx="12" transform="rotate(-38 638 330)" stroke-width="11"/>
    <rect x="582" y="346" width="44" height="24" rx="12" transform="rotate(-38 604 358)" stroke-width="11"/>
    <rect x="548" y="374" width="44" height="24" rx="12" transform="rotate(-38 570 386)" stroke-width="11"/>
  </g>

  <!-- Black acrylic keychain body + top tab -->
  <g filter="url(#softShadow)">
    <!-- Top eyelet tab -->
    <path d="M 488 332 A 36 36 0 1 1 552 368 L 538 395 L 474 359 Z" fill="url(#blackAcrylic)" stroke="url(#rimSheen)" stroke-width="3"/>
    <!-- Main round black acrylic disc -->
    <circle cx="420" cy="560" r="272" fill="url(#blackAcrylic)" stroke="url(#rimSheen)" stroke-width="4"/>
    <!-- Inner subtle bevel -->
    <circle cx="420" cy="560" r="264" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <!-- Glossy diagonal reflection -->
    <path d="M 192 410 A 268 268 0 0 1 580 342 C 510 470 360 545 162 630 A 268 268 0 0 1 192 410 Z" fill="url(#glossSweep)"/>
    <!-- Eyelet hole -->
    <circle cx="520" cy="350" r="14" fill="#dcd8d0"/>
    <!-- Metal jump ring through eyelet -->
    <path d="M 520 350 L 560 390" stroke="url(#silverMetal)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Crisp white question mark centered on black keychain -->
  <g transform="translate(420 568) rotate(-14)">
    <text x="0" y="92" text-anchor="middle" fill="#ffffff" font-family="DM Sans, Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="310" font-weight="800">?</text>
  </g>
</svg>
